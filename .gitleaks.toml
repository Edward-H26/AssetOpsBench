# Gitleaks configuration. Extends the built-in default rule set and adds
# project-specific allowlisting so test fixtures / sample values don't cause
# false positives. Place at repo root as .gitleaks.toml
[extend]
useDefault = true

[allowlist]
description = "Global allowlist for AssetOpsBench"
paths = [
  '''\.secrets\.baseline$''',
  '''(.*?)(test|tests|fixtures|examples|docs)(/|\\).*''',
  '''.*\.md$''',
  # the SHA-256 digests that benchmarks/hydraulic_rig/asset_digests.py writes, no secret
  '''(^|/)benchmarks/hydraulic_rig/asset_digests\.json$''',
  # the SHA-256 digests of the fixed starts that benchmarks/hydraulic_rig/review_pack.py writes, no secret
  '''(^|/)benchmarks/hydraulic_rig/fixed_starts\.json$''',
  # the same two files at their places in CausalDiagnosis/
  '''(^|/)CausalDiagnosis/experiments/run_verification/invariant_digests\.json$''',
  '''(^|/)CausalDiagnosis/episode_viewer/fixed_starts\.json$''',
]
# Known-safe placeholder values (regex). Add real false positives here.
regexes = [
  '''(?i)(your[_-]?api[_-]?key|example|dummy|placeholder|changeme|xxxx+)''',
]

